{% extends "base.html" %}

{% block title %}Buscar Vehículo — Autofix{% endblock %}

{% block content %}
<div class="container">

    <h1>Buscar Vehículo</h1>
    <p class="subtitulo">Ingresa la Patente para ver el historial de servicios.</p>

    <!-- Formulario de búsqueda -->
    <!-- GET /buscar?rut=... redirige a /paciente/{rut}/historial -->
    <form action="/buscar" method="get">
        <label for="rut">Patente del Vehículo</label>
        <input
            type="text"
            id="rut"
            name="rut"
            placeholder="Ej: AB-CD-12"
            required
            autofocus
        >
        <button type="submit">Ver historial</button>
    </form>



</div>
{% endblock %}
