{% extends "base.html" %}

{% block title %}Buscar Paciente — Historial Clínico{% endblock %}

{% block content %}
<div class="container">

    <h1>Buscar Paciente</h1>
    <p class="subtitulo">Ingresa el RUT para ver el historial de tratamientos.</p>

    <!-- Formulario de búsqueda -->
    <!-- GET /buscar?rut=... redirige a /paciente/{rut}/historial -->
    <form action="/buscar" method="get">
        <label for="rut">RUT del paciente</label>
        <input
            type="text"
            id="rut"
            name="rut"
            placeholder="Ej: 12345678-9"
            required
            autofocus
        >
        <button type="submit">Ver historial</button>
    </form>

    <div class="separador">¿Primera sesión del paciente?</div>

    <a href="/sesiones/registrar" class="btn-secundario">
        + Registrar nueva sesión
    </a>

</div>
{% endblock %}
