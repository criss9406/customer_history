{% extends "base.html" %}

{% block title %}Buscar Cliente — Hidropro Bombas{% endblock %}

{% block content %}
<div class="container">

    <h1>Buscar Cliente</h1>
    <p class="subtitulo">Ingresa el RUT para ver el historial de servicios.</p>

    <!-- Formulario de búsqueda -->
    <!-- GET /buscar?rut=... redirige a /paciente/{rut}/historial -->
    <form action="/buscar" method="get">
        <label for="rut">RUT del Cliente</label>
        <input
            type="text"
            id="rut"
            name="rut"
            placeholder="Ej: 12345678-9"
            required
            autofocus
        >
        <button type="submit">Ver historial</button>
    </form>



</div>
{% endblock %}
