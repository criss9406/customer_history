{% extends "base.html" %}

{% block title %}Registrar Servicio — Autofix{% endblock %}

{% block content %}
<div class="container">

    <h1>Registrar Servicio</h1>

    <form action="/sesiones/registrar" method="post">

        <!-- RUT: puede venir precargado desde el historial del paciente -->
        <label for="rut">Patente del Vehículo</label>
        <input
            type="text"
            id="rut"
            name="rut"
            value="{{ rut }}"
            placeholder="Ej: 12345678-9"
            required
        >

        <label for="nombre_paciente">Nombre del Cliente</label>
        <input
            type="text"
            id="nombre_paciente"
            name="nombre_paciente"
            placeholder="Nombre" value="{{ nombre_paciente }}"
            required
        >

        <label for="apellido_paciente">Apellido del Cliente</label>
        <input
            type="text"
            id="apellido_paciente"
            name="apellido_paciente"
            placeholder="Apellido" value="{{ apellido_paciente }}"
            required
        >

        <label for="fecha">Fecha</label>
        <input
            type="date"
            id="fecha"
            name="fecha"
            value="{{ fecha_hoy }}"
            required
        >

        <label for="tipo_atencion">Tipo de Servicio</label>
        <select id="tipo_atencion" name="tipo_atencion" required>
            {% for tipo in tipos_atencion %}
            <option value="{{ tipo }}">{{ tipo }}</option>
            {% endfor %}
        </select>

        <label for="kilometraje">Kilometraje</label>
        <input
            type="number"
            id="kilometraje"
            name="kilometraje"
            placeholder="Ej: 45000"
        >

        <label for="marca_modelo">Marca</label>
        <input
            type="text"
            id="marca"
            name="marca"
            placeholder="Ej: Toyota"
        >

        <label for="modelo">Modelo de Vehículo</label>
        <input
            type="text"
            id="modelo"
            name="modelo"
            placeholder="Ej: Yaris"
        >

        <label for="observaciones">Trabajo Realizado</label>
        <textarea
            id="observaciones"
            name="observaciones"
            rows="5"
            placeholder="Descripción del servicio, ajustes, indicaciones..."
        ></textarea>

        <label for="repuestos_usados">Repuestos Usados</label>
        <textarea
            id="repuestos_usados"
            name="repuestos_usados"
            rows="3"
            placeholder="Filtros, aceite, bujías..."
        ></textarea>

        <label for="registrado_por">Mecánico / Técnico</label>
        <input
            type="text"
            id="registrado_por"
            name="registrado_por"
            placeholder="Nombre del técnico"
            required
        >

        <div class="acciones-form">
            <button type="submit">Guardar servicio</button>
            <a href="/" class="btn-secundario">Cancelar</a>
        </div>

    </form>

</div>
{% endblock %}
